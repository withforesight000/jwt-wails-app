name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  tests:
    name: Go tests with coverage and E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.3-${{ hashFiles('frontend/bun.lock', 'frontend/bunfig.toml', 'frontend/package.json') }}
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.27.2
      - name: Install frontend dependencies
        run: ../scripts/without-node.sh bun install --frozen-lockfile
        working-directory: frontend
      - name: Build frontend assets
        run: ../scripts/without-node.sh bun --bun run build
        working-directory: frontend
      - name: Run Go linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m ./...
      - name: Install Playwright browsers
        run: ../scripts/without-node.sh bun x --bun --no-install playwright install --with-deps chromium
        working-directory: frontend
      - name: Run unit tests
        run: go test -cover ./...
      - name: Run Playwright E2E tests
        run: ../scripts/without-node.sh bun --bun run test:e2e
        working-directory: frontend
      - name: Run frontend linting
        run: ../scripts/without-node.sh bun --bun run lint
        working-directory: frontend
